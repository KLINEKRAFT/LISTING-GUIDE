<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listing Guide — Coldwell Banker Select</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:     #F2F0EB;
    --bg-2:   #E8E5DE;
    --bg-3:   #DEDAD2;
    --ink:    #1A1A18;
    --ink-2:  #4A4A46;
    --ink-3:  #8A8A84;
    --rule:   #CCCAC2;
    --red:    #C0392B;
    --green:  #27AE60;
    --mono:   'Space Mono','Courier New',monospace;
    --sans:   'Helvetica Neue',Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  body{display:flex;flex-direction:column;max-width:860px;margin:0 auto;min-height:100vh}

  header{border-bottom:2px solid var(--ink);padding:20px 32px 18px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;background:var(--bg);position:sticky;top:0;z-index:20}
  .header-left{display:flex;flex-direction:column;gap:3px}
  .header-label{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3)}
  .header-title{font-weight:700;font-size:22px;letter-spacing:-.02em;text-transform:uppercase;line-height:1}

  .feed-status{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.08em;white-space:nowrap;padding-bottom:2px}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--ink-3);flex-shrink:0;transition:background .3s}
  .dot.ok{background:var(--green)}
  .dot.error{background:var(--red)}
  .dot.loading{animation:blink 1s step-end infinite}
  @keyframes blink{50%{opacity:0}}

  #stats-bar{display:none;border-bottom:1px solid var(--rule);background:var(--bg-2)}
  #stats-bar.visible{display:flex}
  .stat{flex:1;padding:11px 20px;border-right:1px solid var(--rule);min-width:0}
  .stat:last-child{border-right:none}
  .stat-label{font-family:var(--mono);font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
  .stat-value{font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:-.01em}

  /* ── Tabs ── */
  #tabs{display:none;border-bottom:1px solid var(--rule);background:var(--bg)}
  #tabs.visible{display:flex}
  .tab{flex:1;padding:11px 20px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);background:transparent;border:none;cursor:pointer;border-right:1px solid var(--rule);transition:all .12s}
  .tab:last-child{border-right:none}
  .tab:hover{color:var(--ink)}
  .tab.active{background:var(--ink);color:var(--bg)}

  .pane{flex:1;overflow-y:auto;display:none;min-height:300px}
  .pane.active{display:flex;flex-direction:column}

  /* ── Chat pane ── */
  #messages{padding:28px 32px;display:flex;flex-direction:column;gap:24px}
  .msg{display:flex;flex-direction:column}
  .msg.user{align-items:flex-end}
  .msg.agent{align-items:flex-start}
  .msg-label{font-family:var(--mono);font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
  .msg-body{max-width:88%;padding:14px 18px;font-size:13px;line-height:1.8;white-space:pre-wrap}
  .msg.user .msg-body{background:var(--ink);color:var(--bg)}
  .msg.agent .msg-body{background:var(--bg-2);color:var(--ink);border:1px solid var(--rule)}

  .thinking-dots{display:flex;gap:5px;align-items:center;padding:16px 18px;background:var(--bg-2);border:1px solid var(--rule)}
  .thinking-dots span{width:5px;height:5px;border-radius:50%;background:var(--ink-3);animation:pulse 1.1s ease-in-out infinite}
  .thinking-dots span:nth-child(2){animation-delay:.2s}
  .thinking-dots span:nth-child(3){animation-delay:.4s}
  @keyframes pulse{0%,100%{opacity:.2;transform:scale(.75)}50%{opacity:1;transform:scale(1)}}

  #chips{padding:0 32px 20px;display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:transparent;border:1px solid var(--rule);color:var(--ink-2);padding:7px 13px;font-family:var(--mono);font-size:10px;letter-spacing:.04em;cursor:pointer;transition:all .12s;border-radius:0}
  .chip:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}

  /* ── Search pane ── */
  #search-pane{padding:0}
  #search-controls{padding:20px 32px;border-bottom:1px solid var(--rule);background:var(--bg-2);display:flex;flex-direction:column;gap:12px}
  #search-input{width:100%;background:var(--bg);border:1px solid var(--rule);padding:11px 14px;font-family:var(--sans);font-size:13px;color:var(--ink);outline:none;transition:border-color .12s}
  #search-input:focus{border-color:var(--ink)}
  #search-input::placeholder{color:var(--ink-3)}

  #filter-row{display:flex;gap:8px;flex-wrap:wrap}
  .filter-pill{background:transparent;border:1px solid var(--rule);color:var(--ink-2);padding:5px 11px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:all .12s}
  .filter-pill.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .filter-pill:hover{border-color:var(--ink)}

  #search-meta{padding:10px 32px;font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--rule);background:var(--bg)}

  #results{flex:1;overflow-y:auto;padding:0}
  .listing-card{padding:16px 32px;border-bottom:1px solid var(--rule);cursor:pointer;transition:background .12s;display:grid;grid-template-columns:1fr auto;gap:8px 24px}
  .listing-card:hover{background:var(--bg-2)}
  .lc-addr{font-weight:700;font-size:13px;letter-spacing:-.01em;line-height:1.4}
  .lc-meta{font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.04em;margin-top:2px}
  .lc-price{font-family:var(--mono);font-size:15px;font-weight:700;text-align:right;letter-spacing:-.02em}
  .lc-status{font-family:var(--mono);font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);text-align:right;margin-top:3px}
  .lc-status.active{color:var(--green)}

  /* ── Agents pane ── */
  .agent-card{padding:14px 32px;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:1fr auto;gap:4px 24px;cursor:pointer;transition:background .12s}
  .agent-card:hover{background:var(--bg-2)}
  .ac-name{font-weight:700;font-size:13px}
  .ac-meta{font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.04em}
  .ac-count{font-family:var(--mono);font-size:15px;font-weight:700;text-align:right;letter-spacing:-.02em}
  .ac-count-label{font-family:var(--mono);font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);text-align:right}

  /* ── Input bar ── */
  #input-area{border-top:2px solid var(--ink);padding:16px 32px;display:flex;gap:10px;background:var(--bg)}
  #msg-input{flex:1;background:var(--bg-2);border:1px solid var(--rule);padding:11px 14px;font-family:var(--sans);font-size:13px;color:var(--ink);outline:none;resize:none;line-height:1.5;transition:border-color .12s}
  #msg-input:focus{border-color:var(--ink)}
  #msg-input::placeholder{color:var(--ink-3)}
  #send-btn{background:var(--ink);color:var(--bg);border:none;padding:0 22px;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:opacity .12s;flex-shrink:0}
  #send-btn:disabled{opacity:.3;cursor:default}
  #send-btn:not(:disabled):hover{opacity:.75}

  footer{border-top:1px solid var(--rule);padding:9px 32px;display:flex;justify-content:space-between;align-items:center;background:var(--bg)}
  footer span{font-family:var(--mono);font-size:8px;color:var(--rule);letter-spacing:.14em;text-transform:uppercase}
  footer .kbd{color:var(--ink-3)}

  #loading{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;padding:48px}
  #loading .bar-track{width:180px;height:2px;background:var(--rule);position:relative;overflow:hidden}
  #loading .bar-fill{position:absolute;top:0;left:-100%;width:100%;height:100%;background:var(--ink);animation:slide 1.2s ease-in-out infinite}
  @keyframes slide{100%{left:100%}}
  #loading p{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}

  ::-webkit-scrollbar{width:3px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:var(--rule)}

  .empty-state{padding:48px 32px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.08em}
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="header-label">Coldwell Banker Select — Internal</div>
    <div class="header-title">Listing Guide</div>
  </div>
  <div class="feed-status">
    <div class="dot loading" id="feed-dot"></div>
    <span id="feed-label">Loading...</span>
  </div>
</header>

<div id="stats-bar">
  <div class="stat"><div class="stat-label">Total</div><div class="stat-value" id="s-total">—</div></div>
  <div class="stat"><div class="stat-label">Active</div><div class="stat-value" id="s-active">—</div></div>
  <div class="stat"><div class="stat-label">Avg Price</div><div class="stat-value" id="s-avg">—</div></div>
  <div class="stat"><div class="stat-label">Median</div><div class="stat-value" id="s-med">—</div></div>
  <div class="stat"><div class="stat-label">Agents</div><div class="stat-value" id="s-agents">—</div></div>
</div>

<div id="tabs">
  <button class="tab active" data-tab="chat">Ask Agent</button>
  <button class="tab" data-tab="search">Search</button>
  <button class="tab" data-tab="agents">Agents</button>
</div>

<div id="loading">
  <div class="bar-track"><div class="bar-fill"></div></div>
  <p id="load-msg">Loading Coldwell Banker Select feed...</p>
</div>

<!-- Chat pane -->
<div class="pane" id="pane-chat">
  <div id="messages"></div>
  <div id="chips"></div>
</div>

<!-- Search pane -->
<div class="pane" id="pane-search">
  <div id="search-controls">
    <input id="search-input" type="text" placeholder="Search city, address, MLS ID, agent..." autocomplete="off">
    <div id="filter-row">
      <button class="filter-pill active" data-filter="status" data-value="all">All Status</button>
      <button class="filter-pill" data-filter="status" data-value="active">Active Only</button>
      <button class="filter-pill" data-filter="price" data-value="all">All Prices</button>
      <button class="filter-pill" data-filter="price" data-value="under-300">&lt; $300k</button>
      <button class="filter-pill" data-filter="price" data-value="300-500">$300k–$500k</button>
      <button class="filter-pill" data-filter="price" data-value="500-1m">$500k–$1M</button>
      <button class="filter-pill" data-filter="price" data-value="1m-plus">$1M+</button>
    </div>
  </div>
  <div id="search-meta">— Results</div>
  <div id="results"></div>
</div>

<!-- Agents pane -->
<div class="pane" id="pane-agents">
  <div id="search-meta" style="margin-top:0">— Agents (sorted by listing count)</div>
  <div id="agents-list" style="flex:1;overflow-y:auto"></div>
</div>

<div id="input-area">
  <textarea id="msg-input" rows="1" placeholder="Ask about listings, agents, comps, market stats..."></textarea>
  <button id="send-btn" disabled>Send</button>
</div>

<footer>
  <span class="kbd">⌘K Search · Enter Send</span>
  <span>klinekraft</span>
</footer>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// CONFIG
// ─────────────────────────────────────────────────────────────────────────────
const API_URL    = "/api/listings";          // Vercel edge function (production)
const CACHE_KEY  = "lg_feed_v3";
const CACHE_TTL  = 30 * 60 * 1000;           // 30 min
const FEED_RAW   = "http://realistiq.net/exports/iq_cb_select_zillow.xml";

// CORS proxy fallback chain — used only if /api/listings fails (e.g. local preview)
const PROXIES = [
  url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
  url => `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(url)}`,
  url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  url => `https://corsfix.com/?${encodeURIComponent(url)}`,
];

const CHIPS = [
  "Top 5 listings by price",
  "Agents with the most active listings",
  "Avg price per sqft in Tulsa",
  "4+ bed homes under $500k in Broken Arrow",
  "Most expensive listing — who is the agent?",
  "Market summary by city",
];

// ─────────────────────────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────────────────────────
let feed       = null;     // { total, activeCount, stats, cityCount, agentIndex, listings, ... }
let history    = [];
let systemPrompt = "";
let thinking   = false;
let currentTab = "chat";
let filters    = { status: "all", price: "all", text: "" };

const $ = id => document.getElementById(id);
const fmt = n => n ? "$" + n.toLocaleString() : "—";

// ─────────────────────────────────────────────────────────────────────────────
// FEED LOADING — cache-first, then network
// ─────────────────────────────────────────────────────────────────────────────
async function loadFeed() {
  // 1. Try cache
  try {
    const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
    if (cached && Date.now() - cached.ts < CACHE_TTL) {
      $("load-msg").textContent = "Loading from cache...";
      feed = cached.data;
      renderAll();
      // Background refresh
      fetchFreshFeed().catch(()=>{});
      return;
    }
  } catch {}

  // 2. Fetch fresh
  $("load-msg").textContent = "Fetching live feed...";
  try {
    feed = await fetchFreshFeed();
    renderAll();
  } catch (err) {
    showError(err.message);
  }
}

async function fetchFreshFeed() {
  // Try the API endpoint first (when deployed)
  try {
    const res = await fetch(API_URL);
    if (res.ok) {
      const data = await res.json();
      if (data.listings && data.listings.length) {
        localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), data }));
        return data;
      }
    }
  } catch {}

  // Fallback: parse XML in browser via CORS proxy chain
  $("load-msg").textContent = "Trying CORS proxy...";
  for (const proxy of PROXIES) {
    try {
      const xml = await fetch(proxy(FEED_RAW)).then(r => r.text());
      if (xml && xml.length > 1000) {
        const data = parseXMLClientSide(xml);
        if (data.listings.length) {
          localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), data }));
          return data;
        }
      }
    } catch {}
  }
  throw new Error("All feed sources unavailable");
}

function parseXMLClientSide(xml) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(xml, "text/xml");
  const nodes = doc.querySelectorAll("Listing");
  const listings = [];
  const g = (n, sel) => n.querySelector(sel)?.textContent?.trim() || "";
  nodes.forEach(n => {
    listings.push({
      a:  g(n,"StreetAddress"), c: g(n,"City"), s: g(n,"State"), z: g(n,"Zip"),
      st: g(n,"Status"),
      p:  parseInt(g(n,"Price")) || 0,
      id: g(n,"MlsId"), u: g(n,"ListingUrl"),
      t:  g(n,"PropertyType"),
      bd: parseInt(g(n,"Bedrooms")) || 0,
      ba: parseFloat(g(n,"Bathrooms")) || 0,
      sf: parseInt(g(n,"LivingArea")) || 0,
      lot:parseFloat(g(n,"LotSize")) || 0,
      yr: parseInt(g(n,"YearBuilt")) || 0,
      pic:n.querySelector("PictureUrl")?.textContent?.trim() || "",
      af: g(n,"FirstName"), al: g(n,"LastName"),
      ae: g(n,"EmailAddress"), ap: g(n,"OfficeLineNumber"),
      o:  g(n,"OfficeName"),
    });
  });

  const active = listings.filter(l => /active/i.test(l.st));
  const prices = active.map(l => l.p).filter(p => p > 0);
  const sorted = [...prices].sort((a,b)=>a-b);
  const stats = {
    avg: prices.length ? Math.round(prices.reduce((a,b)=>a+b,0)/prices.length) : 0,
    med: sorted.length ? sorted[Math.floor(sorted.length/2)] : 0,
    min: sorted[0] || 0,
    max: sorted[sorted.length-1] || 0,
  };

  const cityCount = {};
  listings.forEach(l => { if(l.c) cityCount[l.c] = (cityCount[l.c]||0)+1; });

  const agentIndex = {};
  listings.forEach(l => {
    const name = `${l.af} ${l.al}`.trim();
    if(!name) return;
    if(!agentIndex[name]) agentIndex[name] = { email:l.ae, phone:l.ap, office:l.o, count:0 };
    agentIndex[name].count++;
  });

  const typeCount = {};
  listings.forEach(l => { if(l.t) typeCount[l.t] = (typeCount[l.t]||0)+1; });

  return {
    v: 2, total: listings.length, activeCount: active.length,
    stats, cityCount, typeCount, agentIndex, listings,
    generatedAt: new Date().toISOString(),
  };
}

// ─────────────────────────────────────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────────────────────────────────────
function renderAll() {
  buildSystemPrompt();
  renderStats();
  renderChat();
  renderSearch();
  renderAgents();

  // Reveal UI
  $("loading").style.display = "none";
  $("stats-bar").classList.add("visible");
  $("tabs").classList.add("visible");
  $("pane-chat").classList.add("active");
  $("send-btn").disabled = false;
  $("feed-dot").className = "dot ok";
  $("feed-label").textContent = `${feed.total} listings`;
}

function renderStats() {
  $("s-total").textContent  = feed.total.toLocaleString();
  $("s-active").textContent = feed.activeCount.toLocaleString();
  $("s-avg").textContent    = fmt(feed.stats.avg);
  $("s-med").textContent    = fmt(feed.stats.med);
  $("s-agents").textContent = Object.keys(feed.agentIndex).length.toLocaleString();
}

function buildSystemPrompt() {
  const topCities = Object.entries(feed.cityCount).sort((a,b)=>b[1]-a[1]).slice(0,15)
    .map(([c,n])=>`${c}(${n})`).join(", ");
  const topAgents = Object.entries(feed.agentIndex).sort((a,b)=>b[1].count-a[1].count).slice(0,20)
    .map(([n,d])=>`${n}(${d.count})`).join(", ");

  // Compact sample — first 60 listings, abbreviated
  const sample = feed.listings.slice(0,60).map(l =>
    `[${l.id}] ${l.a}, ${l.c} ${l.s} | ${l.st} | $${l.p.toLocaleString()} | ${l.bd}bd/${l.ba}ba | ${l.sf}sf | ${l.yr} | ${l.af} ${l.al}`
  ).join("\n");

  systemPrompt = `You are the internal listing intelligence agent for Coldwell Banker Select, a real estate brokerage in Tulsa, Oklahoma. Live MLS feed access.

FEED — ${feed.total} listings (${feed.activeCount} active):
Price: avg $${feed.stats.avg.toLocaleString()} | med $${feed.stats.med.toLocaleString()} | range $${feed.stats.min.toLocaleString()}–$${feed.stats.max.toLocaleString()}
Top markets: ${topCities}
Top agents: ${topAgents}

LISTING SAMPLE (first 60 of ${feed.total}):
${sample}

RULES:
- Be direct, data-forward, no filler
- Calculate stats from the data shown
- For agent queries, give full contact (name, email, phone, office, count)
- Format currency cleanly. Use lists for multiple results.
- Active listings only — clarify if user asks about sold/historical data
- No emojis`;
}

function renderChat() {
  if (history.length === 0) {
    history.push({
      role: "assistant",
      content: `Feed loaded — ${feed.total} listings across Oklahoma and Kansas.\n\nAsk me about listings, agents, comps, or market stats. Or use the Search tab for instant filtering.`,
    });
    appendMessage("agent", history[0].content);

    const chipWrap = $("chips");
    chipWrap.innerHTML = "";
    CHIPS.forEach(text => {
      const btn = document.createElement("button");
      btn.className = "chip";
      btn.textContent = text;
      btn.onclick = () => { $("msg-input").value = text; $("msg-input").focus(); };
      chipWrap.appendChild(btn);
    });
  }
}

function renderSearch() {
  applyFilters();
}

function renderAgents() {
  const wrap = $("agents-list");
  wrap.innerHTML = "";
  const sorted = Object.entries(feed.agentIndex).sort((a,b)=>b[1].count-a[1].count);
  sorted.forEach(([name, d]) => {
    const card = document.createElement("div");
    card.className = "agent-card";
    card.innerHTML = `
      <div>
        <div class="ac-name">${name}</div>
        <div class="ac-meta">${d.email || "—"}  ·  ${d.phone || "—"}</div>
        <div class="ac-meta">${d.office || "—"}</div>
      </div>
      <div>
        <div class="ac-count">${d.count}</div>
        <div class="ac-count-label">Listings</div>
      </div>`;
    card.onclick = () => {
      $("msg-input").value = `Tell me about ${name}'s listings`;
      switchTab("chat");
      send();
    };
    wrap.appendChild(card);
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// SEARCH FILTERING — instant, no API
// ─────────────────────────────────────────────────────────────────────────────
function applyFilters() {
  const q = filters.text.toLowerCase().trim();
  let results = feed.listings;

  if (filters.status === "active") {
    results = results.filter(l => /active/i.test(l.st));
  }

  if (filters.price !== "all") {
    results = results.filter(l => {
      const p = l.p;
      if (filters.price === "under-300") return p < 300000 && p > 0;
      if (filters.price === "300-500")   return p >= 300000 && p < 500000;
      if (filters.price === "500-1m")    return p >= 500000 && p < 1000000;
      if (filters.price === "1m-plus")   return p >= 1000000;
      return true;
    });
  }

  if (q) {
    results = results.filter(l =>
      l.a.toLowerCase().includes(q) ||
      l.c.toLowerCase().includes(q) ||
      l.id.toLowerCase().includes(q) ||
      `${l.af} ${l.al}`.toLowerCase().includes(q) ||
      l.z.includes(q)
    );
  }

  $("search-meta").textContent = `${results.length} ${results.length === 1 ? "result" : "results"}`;

  const wrap = $("results");
  wrap.innerHTML = "";
  if (!results.length) {
    wrap.innerHTML = '<div class="empty-state">No matches</div>';
    return;
  }

  // Render up to 200 to keep DOM light
  results.slice(0, 200).forEach(l => {
    const card = document.createElement("div");
    card.className = "listing-card";
    const isActive = /active/i.test(l.st);
    card.innerHTML = `
      <div>
        <div class="lc-addr">${l.a}, ${l.c} ${l.s} ${l.z}</div>
        <div class="lc-meta">[${l.id}] · ${l.bd}bd / ${l.ba}ba · ${l.sf ? l.sf.toLocaleString() + " sqft" : "—"} · ${l.yr || "—"} · ${l.af} ${l.al}</div>
      </div>
      <div>
        <div class="lc-price">${fmt(l.p)}</div>
        <div class="lc-status ${isActive ? "active" : ""}">${l.st || "—"}</div>
      </div>`;
    card.onclick = () => {
      $("msg-input").value = `Tell me everything about MLS ${l.id}`;
      switchTab("chat");
      send();
    };
    wrap.appendChild(card);
  });

  if (results.length > 200) {
    const more = document.createElement("div");
    more.className = "empty-state";
    more.textContent = `+ ${results.length - 200} more — refine your search`;
    wrap.appendChild(more);
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// CHAT
// ─────────────────────────────────────────────────────────────────────────────
function appendMessage(role, content) {
  const wrap = document.createElement("div");
  wrap.className = `msg ${role}`;
  const label = document.createElement("div");
  label.className = "msg-label";
  label.textContent = role === "user" ? "You" : "Listing Agent";
  const body = document.createElement("div");
  body.className = "msg-body";
  body.textContent = content;
  wrap.appendChild(label);
  wrap.appendChild(body);
  $("messages").appendChild(wrap);
  wrap.scrollIntoView({ behavior: "smooth", block: "end" });
  return wrap;
}

function showThinking() {
  const wrap = document.createElement("div");
  wrap.className = "msg agent";
  wrap.id = "thinking-wrap";
  wrap.innerHTML = '<div class="msg-label">Listing Agent</div><div class="thinking-dots"><span></span><span></span><span></span></div>';
  $("messages").appendChild(wrap);
  wrap.scrollIntoView({ behavior: "smooth", block: "end" });
}

function removeThinking() {
  $("thinking-wrap")?.remove();
}

async function send() {
  const input = $("msg-input");
  const text = input.value.trim();
  if (!text || thinking) return;

  $("chips").style.display = "none";
  input.value = "";
  input.style.height = "auto";
  thinking = true;
  $("send-btn").disabled = true;

  if (currentTab !== "chat") switchTab("chat");

  history.push({ role: "user", content: text });
  appendMessage("user", text);
  showThinking();

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        system: systemPrompt,
        messages: history,
      }),
    });
    const data = await res.json();
    const reply = data.content?.[0]?.text || "No response.";
    history.push({ role: "assistant", content: reply });
    removeThinking();
    appendMessage("agent", reply);
  } catch {
    removeThinking();
    appendMessage("agent", "Error reaching the agent. Please try again.");
  } finally {
    thinking = false;
    $("send-btn").disabled = false;
    input.focus();
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// TABS
// ─────────────────────────────────────────────────────────────────────────────
function switchTab(name) {
  currentTab = name;
  document.querySelectorAll(".tab").forEach(t => {
    t.classList.toggle("active", t.dataset.tab === name);
  });
  document.querySelectorAll(".pane").forEach(p => {
    p.classList.toggle("active", p.id === `pane-${name}`);
  });
  if (name === "search") setTimeout(() => $("search-input").focus(), 50);
}

// ─────────────────────────────────────────────────────────────────────────────
// ERROR
// ─────────────────────────────────────────────────────────────────────────────
function showError(msg) {
  $("loading").style.display = "none";
  $("stats-bar").classList.add("visible");
  $("tabs").classList.add("visible");
  $("pane-chat").classList.add("active");
  $("feed-dot").className = "dot error";
  $("feed-label").textContent = "Feed unavailable";
  appendMessage("agent", `Feed unavailable: ${msg}\n\nThe agent will use general knowledge until the feed loads. Try refreshing.`);
  systemPrompt = "You are the Coldwell Banker Select listing intelligence agent. The live feed is currently unavailable.";
  $("send-btn").disabled = false;
}

// ─────────────────────────────────────────────────────────────────────────────
// EVENTS
// ─────────────────────────────────────────────────────────────────────────────
document.querySelectorAll(".tab").forEach(t => {
  t.addEventListener("click", () => switchTab(t.dataset.tab));
});

$("send-btn").addEventListener("click", send);

$("msg-input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});

$("msg-input").addEventListener("input", function() {
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight, 120) + "px";
});

$("search-input").addEventListener("input", e => {
  filters.text = e.target.value;
  applyFilters();
});

document.querySelectorAll(".filter-pill").forEach(p => {
  p.addEventListener("click", () => {
    const dim = p.dataset.filter;
    filters[dim] = p.dataset.value;
    document.querySelectorAll(`.filter-pill[data-filter="${dim}"]`).forEach(x => {
      x.classList.toggle("active", x.dataset.value === filters[dim]);
    });
    applyFilters();
  });
});

// Cmd+K → switch to search
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "k") {
    e.preventDefault();
    switchTab("search");
  }
  if (e.key === "Escape" && currentTab === "search") {
    $("search-input").value = "";
    filters.text = "";
    applyFilters();
  }
});

loadFeed();
</script>
</body>
</html>
